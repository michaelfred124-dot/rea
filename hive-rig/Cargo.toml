[package]
name = "hive-rig"
version = "0.1.0"
edition = "2024"
default-run = "hive-rig"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
glam = { version = "0.34.1", features = ["serde"] }
gltf = "1.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "accesskit", "clipboard", "links"] }
rfd = { version = "0.17.2", optional = true }

[features]
default = ["studio"]
# The Hive Rig desktop app (`HiveRig`). The command-line `hive-rig` doesn't need it.
studio = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "hive-rig"
path = "src/main.rs"

[[bin]]
name = "HiveRig"
path = "src/studio/main.rs"
required-features = ["studio"]

[profile.release]
strip = true
