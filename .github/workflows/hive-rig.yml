name: hive-rig

on:
  push:
    branches: [main]
    paths: ["hive-rig/**", ".github/workflows/hive-rig.yml"]
  pull_request:
    paths: ["hive-rig/**", ".github/workflows/hive-rig.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hive-rig-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: hive-rig

jobs:
  rust:
    name: Rust build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Open the Hive Rig app on a virtual screen
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb libxkbcommon-x11-0 libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1400x900x24" cargo run --locked -q --bin HiveRig -- \
            --demo --build --weights upperarm_l --screenshot "$RUNNER_TEMP/hive-rig-app.ppm"
          test "$(head -c 2 "$RUNNER_TEMP/hive-rig-app.ppm")" = P6
      - name: Generate demo rigs (T-pose and A-pose)
        run: |
          cargo run --locked -q -- demo -o "$RUNNER_TEMP/t_pose"
          cargo run --locked -q -- demo -o "$RUNNER_TEMP/a_pose" --arm-drop 45
      - name: Maya and Unreal builders run against stub APIs
        run: |
          for pose in t_pose a_pose; do
            python3 -I tests/dcc_stub_run.py maya "$RUNNER_TEMP/$pose/hive_demo_maya.py"
            python3 -I tests/dcc_stub_run.py unreal "$RUNNER_TEMP/$pose/hive_demo_unreal.py"
          done
      - name: Components - add, remove, rebuild and the Maya guide tools
        run: |
          rig="$RUNNER_TEMP/components"
          cargo run --locked -q -- demo -o "$rig"
          cargo run --locked -q -- add "$rig/hive_demo.guides.json" fingers
          cargo run --locked -q -- add "$rig/hive_demo.guides.json" tail
          cargo run --locked -q -- add "$rig/hive_demo.guides.json" chain --parent head --joints 2 --id ear
          cargo run --locked -q -- add "$rig/hive_demo.guides.json" eyes
          cargo run --locked -q -- add "$rig/hive_demo.guides.json" jaw
          cargo run --locked -q -- add "$rig/hive_demo.guides.json" face
          cargo run --locked -q -- remove "$rig/hive_demo.guides.json" ear
          cargo run --locked -q -- components "$rig/hive_demo.guides.json"
          cargo run --locked -q -- rebuild "$rig/hive_demo.hive.json"
          python3 -I tests/dcc_stub_run.py unreal "$rig/hive_demo_unreal.py"
          python3 -I tests/dcc_stub_run.py maya "$rig/hive_demo_maya.py" --guides
          # Again with another naming convention (the guide tools add stub_ear each run).
          cargo run --locked -q -- remove "$rig/hive_demo.guides.json" stub_ear
          cargo run --locked -q -- naming "$rig/hive_demo.guides.json" suffix
          cargo run --locked -q -- rebuild "$rig/hive_demo.hive.json"
          python3 -I tests/dcc_stub_run.py unreal "$rig/hive_demo_unreal.py"
          python3 -I tests/dcc_stub_run.py maya "$rig/hive_demo_maya.py" --guides
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hive-demo-rigs
          path: ${{ runner.temp }}/*_pose
          retention-days: 7

  windows:
    name: Windows build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        run: rustup update stable && rustup default stable
      - run: cargo build --release --locked
      - name: Rig the demo with the Windows command line
        shell: bash
        run: ./target/release/hive-rig.exe demo -o "$RUNNER_TEMP/win_demo"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hive-rig-windows
          path: |
            hive-rig/target/release/HiveRig.exe
            hive-rig/target/release/hive-rig.exe
          retention-days: 14

  blender:
    name: Build and exercise the rig in Blender
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install Blender as a Python module
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libxkbcommon0 libsm6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1
          python -m pip install --quiet bpy==5.2.2
      - name: Generate and check rigs
        run: |
          for drop in 0 45; do
            cargo run -q -- demo -o "$RUNNER_TEMP/rig$drop" --arm-drop "$drop"
            python tests/blender_check.py "$RUNNER_TEMP/rig$drop/hive_demo_blender.py" "$RUNNER_TEMP/rig$drop/hive_demo.glb"
          done
      - name: Eyes, jaw, face joints and fingers in Blender
        run: |
          rig="$RUNNER_TEMP/face"
          cargo run -q -- demo -o "$rig"
          for part in eyes jaw face fingers; do cargo run -q -- add "$rig/hive_demo.guides.json" "$part"; done
          cargo run -q -- rebuild "$rig/hive_demo.hive.json"
          python tests/blender_check.py "$rig/hive_demo_blender.py" "$rig/hive_demo.glb"
      - name: Side-first naming in Blender
        run: |
          rig="$RUNNER_TEMP/face"
          cargo run -q -- naming "$rig/hive_demo.guides.json" prefix
          cargo run -q -- rebuild "$rig/hive_demo.hive.json"
          python tests/blender_check.py "$rig/hive_demo_blender.py" "$rig/hive_demo.glb"
          named="$RUNNER_TEMP/named_guides"
          cargo run -q -- demo -o "$named"
          cargo run -q -- naming "$named/hive_demo.guides.json" prefix
          cargo run -q -- rebuild "$named/hive_demo.hive.json"
          python tests/blender_guides_check.py "$named/hive_demo_blender.py"
      - name: Joints to guides - a Mixamo-named skeleton exported from Blender
        run: |
          rig="$RUNNER_TEMP/joints"
          cargo run -q -- demo -o "$rig"
          for part in eyes jaw face; do cargo run -q -- add "$rig/hive_demo.guides.json" "$part"; done
          cargo run -q -- rebuild "$rig/hive_demo.hive.json"
          python tests/blender_joints_export.py "$rig/hive_demo.glb" "$rig/mixamo.glb"
          cargo run -q -- rig "$rig/mixamo.glb" -o "$rig/out" | tee "$rig/log.txt"
          grep -q "and added eyes, jaw, face" "$rig/log.txt"
          python3 - "$rig/hive_demo.guides.json" "$rig/out/mixamo.guides.json" <<'PY'
          import json, sys
          a, b = (json.load(open(p)) for p in sys.argv[1:])
          def pos(g, comp, name):
              c = next(c for c in g["components"] if c["id"] == comp)
              return next(x["position"] for x in c["guides"] if x["name"] == name)
          # The brow was raised 1 cm in Blender; the shoulder kept its place.
          assert abs(pos(b, "face", "brow_in_l")[1] - pos(a, "face", "brow_in_l")[1] - 0.01) < 1e-3
          assert all(abs(x - y) < 1e-3 for x, y in zip(pos(a, "arm_l", "shoulder"), pos(b, "arm_l", "shoulder")))
          print("joints read back as guides")
          PY
          python tests/blender_check.py "$rig/out/mixamo_blender.py" "$rig/out/mixamo.glb"
      - name: Edit guides, add fingers and a tail, and rebuild in Blender
        run: |
          cargo run -q -- demo -o "$RUNNER_TEMP/guides"
          python tests/blender_guides_check.py "$RUNNER_TEMP/guides/hive_demo_blender.py"
